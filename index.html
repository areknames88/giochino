<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Gioco RPG top-down costruito con Phaser 3."
    />
    <title>Giochino Jackanal</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #14100c;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }

      body {
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        color: #e8d9c3;
      }

      /* Phaser centra il canvas con marginLeft/marginTop: niente flex qui,
         altrimenti il canvas viene centrato due volte e resta storto. */
      #app {
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
        touch-action: none;
      }

      #boot-message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
        background: #14100c;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      #boot-message.hidden {
        opacity: 0;
      }

      #boot-message strong {
        font-size: 1.1rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #d8a05a;
      }

      #boot-message span {
        font-size: 0.8rem;
        color: #8d7a63;
      }

      noscript {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14100c;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="boot-message">
      <strong>Giochino Jackanal</strong>
      <span>caricamento&hellip;</span>
    </div>

    <noscript>Questo gioco richiede JavaScript attivo.</noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
